name: Test Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Send Telegram message
        run: npm start -- --test-telegram
        env:
          TG_BOT_KEY: ${{ secrets.TG_BOT_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
