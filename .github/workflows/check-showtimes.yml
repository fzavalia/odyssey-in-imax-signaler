name: Check Showtimes

on:
  # Schedule disabled: project is deprecated. Manual runs still work.
  # schedule:
  #   # Run every hour at minute 17 in Buenos Aires time.
  #   - cron: "17 * * * *"
  #     timezone: "America/Argentina/Buenos_Aires"
  workflow_dispatch:

# Allow the workflow to commit updated movie data.
permissions:
  contents: write

# Prevent scheduled and manual checks from running at the same time.
concurrency:
  group: check-showtimes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Save the current hash to detect whether the check updates the movie data.
      - name: Capture movie data
        id: movie_data
        run: echo "hash=${{ hashFiles('data.json') }}" >> "$GITHUB_OUTPUT"

      - name: Check showtimes
        run: npm start
        env:
          TG_BOT_KEY: ${{ secrets.TG_BOT_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # Persist the new baseline only when the movie data changed.
      - name: Commit movie data
        if: hashFiles('data.json') != steps.movie_data.outputs.hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: update movie data"
          git push
